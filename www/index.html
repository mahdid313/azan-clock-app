<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Azan Clock</title>
    <!-- Capacitor will inject its scripts here -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-color: #00ff88;
            --secondary-color: #00d4ff;
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
        }
        
        body.light-mode {
            --primary-color: #2d5016;
            --secondary-color: #1a4d8f;
            --bg-gradient-start: #fff8e7;
            --bg-gradient-end: #f5e6d3;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            transition: all 0.3s ease;
        }
        
        .top-bar {
            position: fixed;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0 20px;
            z-index: 100;
        }
        
        .settings-btn, .mute-btn {
            background: rgba(0, 212, 255, 0.2);
            border: 2px solid var(--secondary-color);
            color: var(--secondary-color);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.4em;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        
        .settings-btn:hover, .mute-btn:hover {
            background: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
        }
        
        .battery {
            font-size: 0.7em;
            color: var(--secondary-color);
            opacity: 0.5;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 80px 20px 20px;
        }
        
        .time-display {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .current-time {
            font-size: 7em;
            font-weight: bold;
            letter-spacing: 8px;
            text-shadow: 0 0 20px var(--primary-color);
            color: var(--primary-color);
            line-height: 1;
        }
        
        .current-date {
            font-size: 1.3em;
            color: var(--secondary-color);
            margin-bottom: 15px;
        }
        
        .countdown {
            font-size: 1em;
            color: var(--primary-color);
            margin-top: 10px;
            opacity: 0.8;
        }
        
        .prayer-times {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: nowrap;
            margin-bottom: 20px;
        }
        
        .prayer-card {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid var(--secondary-color);
            border-radius: 10px;
            padding: 15px 25px;
            text-align: center;
            transition: all 0.3s;
            min-width: 110px;
        }
        
        .prayer-card.active {
            background: rgba(0, 255, 136, 0.2);
            border-color: var(--primary-color);
            box-shadow: 0 0 20px var(--primary-color);
            transform: scale(1.1);
        }
        
        .prayer-card.upcoming {
            background: rgba(255, 200, 0, 0.1);
            border-color: #ffc800;
        }
        
        .prayer-name {
            font-size: 0.95em;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--secondary-color);
        }
        
        .prayer-time {
            font-size: 1.3em;
            color: var(--primary-color);
        }
        
        .tomorrow-times {
            font-size: 0.9em;
            color: var(--secondary-color);
            opacity: 0.6;
            text-align: center;
            margin-top: 10px;
        }
        
        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            overflow-y: auto;
        }
        
        .settings-modal.active {
            display: block;
        }
        
        .settings-container {
            max-width: 800px;
            margin: 50px auto;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid var(--secondary-color);
            border-radius: 15px;
            padding: 30px;
        }
        
        body.light-mode .settings-container {
            background: linear-gradient(135deg, #fff8e7 0%, #f5e6d3 100%);
        }
        
        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .settings-header h2 {
            color: var(--secondary-color);
            font-size: 2em;
        }
        
        .close-btn {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }
        
        .close-btn:hover {
            background: rgba(0, 255, 136, 0.4);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--secondary-color);
            flex-wrap: wrap;
        }
        
        .tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: var(--secondary-color);
            cursor: pointer;
            font-size: 0.95em;
            font-family: 'Courier New', monospace;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .setting-group {
            margin-bottom: 25px;
        }
        
        .setting-group label {
            display: block;
            color: var(--secondary-color);
            margin-bottom: 8px;
            font-size: 1em;
        }
        
        .setting-group select,
        .setting-group input[type="time"],
        .setting-group input[type="number"],
        .setting-group input[type="range"] {
            width: 100%;
            padding: 10px;
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid var(--secondary-color);
            border-radius: 8px;
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
            font-size: 1em;
        }
        
        .setting-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            color: var(--primary-color);
            margin-bottom: 10px;
        }
        
        .audio-control {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .audio-control select {
            flex: 1;
        }
        
        .test-btn {
            background: rgba(255, 200, 0, 0.2);
            border: 2px solid #ffc800;
            color: #ffc800;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            transition: all 0.3s;
        }
        
        .test-btn:hover {
            background: rgba(255, 200, 0, 0.4);
        }
        
        .test-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .refresh-btn {
            background: rgba(0, 212, 255, 0.2);
            border: 2px solid var(--secondary-color);
            color: var(--secondary-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin-top: 10px;
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            background: rgba(0, 212, 255, 0.4);
        }
        
        .color-themes {
            display: flex;
            gap: 15px;
        }
        
        .color-theme {
            width: 60px;
            height: 60px;
            border-radius: 10px;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.3s;
        }
        
        .color-theme.active {
            border-color: white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
        
        .theme-green { background: linear-gradient(135deg, #00ff88, #00d4ff); }
        .theme-blue { background: linear-gradient(135deg, #00d4ff, #0088ff); }
        .theme-purple { background: linear-gradient(135deg, #a855f7, #ec4899); }
        
        .volume-slider {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .volume-slider label {
            min-width: 100px;
            margin-bottom: 0;
        }
        
        .volume-slider input[type="range"] {
            flex: 1;
        }
        
        .volume-value {
            min-width: 50px;
            text-align: right;
            color: var(--primary-color);
        }
        
        .dua-schedule {
            display: grid;
            gap: 15px;
        }
        
        .dua-day {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid var(--secondary-color);
            border-radius: 8px;
            padding: 15px;
        }
        
        .dua-day h4 {
            color: var(--secondary-color);
            margin-bottom: 10px;
        }
        
        .dua-entry {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: stretch;
        }
        
        .dua-entry select {
            flex: 1;
            padding: 8px;
            background: rgba(0, 212, 255, 0.05);
            border: 1px solid var(--secondary-color);
            border-radius: 5px;
            color: var(--primary-color);
            font-family: 'Courier New', monospace;
        }
        
        .dua-entry .remove-btn {
            width: 40px;
            flex-shrink: 0;
        }
        
        .remove-btn {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .add-btn {
            background: rgba(0, 255, 136, 0.2);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin-top: 10px;
        }
        
        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 2px solid #ff0000;
            color: #ff0000;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        @media (max-width: 800px) {
            .current-time {
                font-size: 4.5em;
            }
            .prayer-times {
                gap: 15px;
            }
            .prayer-card {
                min-width: 90px;
                padding: 12px 15px;
            }
            .tabs {
                font-size: 0.85em;
            }
            .tab {
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
        <button class="mute-btn" id="mute-btn" onclick="toggleMute()">🔊</button>
    </div>
    
    <div class="battery" id="battery">🔋 --</div>
    
            <div class="main-content">
        <div class="time-display">
            <div class="current-date" id="current-date">Loading...</div>
            <div class="current-time" id="current-time">00:00:00</div>
            <div class="countdown" id="countdown"></div>
        </div>
        
        <div class="prayer-times" id="prayer-times">
            <div class="prayer-card">
                <div class="prayer-name">Fajr</div>
                <div class="prayer-time">--:--</div>
            </div>
            <div class="prayer-card">
                <div class="prayer-name">Sunrise</div>
                <div class="prayer-time">--:--</div>
            </div>
            <div class="prayer-card">
                <div class="prayer-name">Zohr</div>
                <div class="prayer-time">--:--</div>
            </div>
            <div class="prayer-card">
                <div class="prayer-name">Maghrib</div>
                <div class="prayer-time">--:--</div>
            </div>
        </div>
        
        <div class="tomorrow-times" id="tomorrow-times"></div>
    </div>
    
    <div class="settings-modal" id="settings-modal">
        <div class="settings-container">
            <div class="settings-header">
                <h2>⚙️ Settings</h2>
                <button class="close-btn" onclick="saveAndClose()">💾 Save & Close</button>
            </div>
            
            <div class="error-message" id="error-message"></div>
            
            <div class="tabs">
                <button class="tab active" onclick="switchTab('display')">Display</button>
                <button class="tab" onclick="switchTab('volume')">Volume</button>
                <button class="tab" onclick="switchTab('azan')">Azan</button>
                <button class="tab" onclick="switchTab('dua')">Dua</button>
                <button class="tab" onclick="switchTab('tasbeeh')">Tasbeeh</button>
            </div>
            
            <div id="display-tab" class="tab-content active">
                <div class="setting-group">
                    <label>Color Theme</label>
                    <div class="color-themes">
                        <div class="color-theme theme-green active" onclick="setTheme('green')"></div>
                        <div class="color-theme theme-blue" onclick="setTheme('blue')"></div>
                        <div class="color-theme theme-purple" onclick="setTheme('purple')"></div>
                    </div>
                </div>
                
                <div class="setting-group">
                    <div class="checkbox-label">
                        <input type="checkbox" id="light-mode">
                        <span>☀️ Light Mode</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label>Font Size</label>
                    <select id="font-size">
                        <option value="small">Small</option>
                        <option value="medium" selected>Medium</option>
                        <option value="large">Large</option>
                        <option value="xlarge">Extra Large</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label>Time Format</label>
                    <select id="time-format">
                        <option value="24">24 Hour</option>
                        <option value="12">12 Hour</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label>Show/Hide Elements</label>
                    <div class="checkbox-label">
                        <input type="checkbox" id="show-date" checked>
                        <span>Show Date</span>
                    </div>
                    <div class="checkbox-label">
                        <input type="checkbox" id="show-imsaak">
                        <span>Show Imsaak</span>
                    </div>
                    <div class="checkbox-label">
                        <input type="checkbox" id="show-sunrise" checked>
                        <span>Show Sunrise</span>
                    </div>
                    <div class="checkbox-label">
                        <input type="checkbox" id="show-sunset">
                        <span>Show Sunset</span>
                    </div>
                    <div class="checkbox-label">
                        <input type="checkbox" id="show-tomorrow-fajr">
                        <span>Show Tomorrow Fajr</span>
                    </div>
                    <div class="checkbox-label">
                        <input type="checkbox" id="show-battery" checked>
                        <span>Show Battery</span>
                    </div>
                    <div class="checkbox-label">
                        <input type="checkbox" id="show-countdown" checked>
                        <span>Show Countdown to Next Prayer</span>
                    </div>
                    <div class="checkbox-label">
                        <input type="checkbox" id="show-seconds" checked>
                        <span>Show Seconds</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label>Screen Brightness (%)</label>
                    <input type="number" id="brightness" min="10" max="100" value="100">
                </div>
                
                <div class="setting-group">
                    <label>Auto Dim at Night</label>
                    <div class="checkbox-label">
                        <input type="checkbox" id="auto-dim">
                        <span>Enable (dims after Maghrib)</span>
                    </div>
                </div>
            </div>
            
            <div id="volume-tab" class="tab-content">
                <div class="setting-group">
                    <label>Volume Controls</label>
                    
                    <div class="volume-slider">
                        <label>Azan:</label>
                        <input type="range" id="volume-azan" min="0" max="100" value="100" oninput="updateVolumeDisplay('azan')">
                        <span class="volume-value" id="volume-azan-value">100%</span>
                    </div>
                    
                    <div class="volume-slider">
                        <label>Duas:</label>
                        <input type="range" id="volume-duas" min="0" max="100" value="70" oninput="updateVolumeDisplay('duas')">
                        <span class="volume-value" id="volume-duas-value">70%</span>
                    </div>
                    
                    <div class="volume-slider">
                        <label>Tasbeeh:</label>
                        <input type="range" id="volume-tasbeeh" min="0" max="100" value="70" oninput="updateVolumeDisplay('tasbeeh')">
                        <span class="volume-value" id="volume-tasbeeh-value">70%</span>
                    </div>
                </div>
            </div>
            
            <div id="azan-tab" class="tab-content">
                <div class="setting-group">
                    <label>Prayer Times CSV</label>
                    <select id="timing-csv">
                        <option value="Hujjat_Stanmore.csv">Hujjat Stanmore</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label>Azan Audio File</label>
                    <div class="audio-control">
                        <select id="azan-audio">
                            <option value="Kadhmain.mp3">Kadhmain</option>
                        </select>
                        <button class="test-btn" onclick="testAudio('azan')" id="test-azan-btn">▶️ Test</button>
                        <button class="remove-btn" onclick="stopTestAudio()" id="stop-azan-btn" style="display: none;">⏹️ Stop</button>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label>📤 Upload Custom CSV File</label>
                    <input type="file" id="upload-csv" accept=".csv" style="display: none;" onchange="handleCSVUpload(event)">
                    <button class="add-btn" onclick="document.getElementById('upload-csv').click()">+ Upload CSV</button>
                </div>
                
                <button class="refresh-btn" onclick="reloadPrayerTimes()">🔄 Reload Prayer Times</button>
            </div>
            
            <div id="dua-tab" class="tab-content">
                <div class="dua-schedule" id="dua-schedule"></div>
            </div>
            
            <div id="tasbeeh-tab" class="tab-content">
                <div class="setting-group">
                    <div class="checkbox-label">
                        <input type="checkbox" id="tasbeeh-enabled" checked>
                        <span>Enable Tasbeeh</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label>Start Time</label>
                    <input type="time" id="tasbeeh-start" value="08:00">
                </div>
                
                <div class="setting-group">
                    <label>End Time</label>
                    <input type="time" id="tasbeeh-end" value="21:30">
                </div>
                
                <div class="setting-group">
                    <label>Frequency (minutes)</label>
                    <select id="tasbeeh-frequency">
                        <option value="15">Every 15 minutes</option>
                        <option value="30" selected>Every 30 minutes</option>
                        <option value="60">Every hour</option>
                    </select>
                </div>
                
                <div class="setting-group">
                    <label>Tasbeeh Audio</label>
                    <div class="audio-control">
                        <select id="tasbeeh-audio">
                            <option value="rotate">🔄 Rotate All</option>
                        </select>
                        <button class="test-btn" onclick="testAudio('tasbeeh')" id="test-tasbeeh-btn">▶️ Test</button>
                        <button class="remove-btn" onclick="stopTestAudio()" id="stop-tasbeeh-btn" style="display: none;">⏹️ Stop</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <audio id="audio-player"></audio>
    <audio id="test-audio-player"></audio>
    
    <script>
        let prayerData = [];
        let currentAudio = null;
        let testAudioPlayer = null;
        let lastPlayedEvent = null;
        let lastTasbeehMinute = -1;
        let audioQueue = [];
        let isMuted = false;
        let currentTasbeehIndex = 0;
        let countdownInterval = null;
        let currentlyPlayingDua = false;
        
        let azanFiles = [
            {file: 'Kadhmain.mp3', name: 'Kadhmain'},
            {file: 'Karbala.mp3', name: 'Karbala'},
            {file: 'Mashhad.mp3', name: 'Mashhad'},
            {file: 'Najaf.mp3', name: 'Najaf'},
            {file: 'Qom.mp3', name: 'Qom'}
        ];
        
        let duaFiles = [
            {file: 'dua-ahad.mp3', name: 'Dua Ahad'},
            {file: 'Dua for Friday.mp3', name: 'Dua for Friday'},
            {file: 'Dua for Monday.mp3', name: 'Dua for Monday'},
            {file: 'Dua for Saturday.mp3', name: 'Dua for Saturday'},
            {file: 'Dua for Sunday.mp3', name: 'Dua for Sunday'},
            {file: 'Dua for Thursday.mp3', name: 'Dua for Thursday'},
            {file: 'Dua for Tuesday.mp3', name: 'Dua for Tuesday'},
            {file: 'Dua for Wednesday.mp3', name: 'Dua for Wednesday'},
            {file: 'Dua_Faraj.mp3', name: 'Dua Faraj'},
            {file: 'Dua_Iftitah.mp3', name: 'Dua Iftitah'},
            {file: 'dua_kumayl.mp3', name: 'Dua Kumayl'},
            {file: 'dua_mashlool.mp3', name: 'Dua Mashlool'},
            {file: 'dua_mujeer.mp3', name: 'Dua Mujeer'},
            {file: 'Dua_Nudba.mp3', name: 'Dua Nudba'},
            {file: 'dua_sabah.mp3', name: 'Dua Sabah'},
            {file: 'dua_samaat.mp3', name: 'Dua Samaat'},
            {file: 'dua_tawassul.mp3', name: 'Dua Tawassul'},
            {file: 'dua_yastasheer.mp3', name: 'Dua Yastasheer'},
            {file: 'Juz 30.mp3', name: 'Juz 30'},
            {file: 'Surah Mulk.mp3', name: 'Surah Mulk'},
            {file: 'Surah Rahman.mp3', name: 'Surah Rahman'},
            {file: 'Surah Waqiah.mp3', name: 'Surah Waqiah'},
            {file: 'Surah Yaseen.mp3', name: 'Surah Yaseen'},
            {file: 'Tasbihaat alAshar.mp3', name: 'Tasbihaat alAshar'},
            {file: 'Ziyarat Jamia Kabeer.mp3', name: 'Ziyarat Jamia Kabeer'},
            {file: 'Ziyarat_Ashura.mp3', name: 'Ziyarat Ashura'}
        ];
        
        let tasbeehFiles = [
            {file: 'Alhamdulillah.mp3', name: 'Alhamdulillah'},

        // Dynamic function to get all available timing files
        function getAllTimingFiles() {
            const customCSVFiles = JSON.parse(localStorage.getItem('customCSVFiles') || '{}');
            const downloadedTimings = Object.keys(customCSVFiles).map(filename => ({
                file: filename,
                name: filename.replace('.csv', '').replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())
            }));
            
            // Combine built-in + downloaded from GitHub + user uploaded
            const combined = [...builtInTimingFiles, ...downloadedTimings, ...customFiles.timing];
            
            // Remove duplicates by filename
            const unique = [];
            const seen = new Set();
            for (const item of combined) {
                if (!seen.has(item.file)) {
                    seen.add(item.file);
                    unique.push(item);
                }
            }
            
            return unique;
        }

        function addDua(dayIndex) {
            addDuaEntry(dayIndex, 'Fajr', 0, 'dua_yastasheer.mp3', (settings.duaSchedule[dayIndex] || []).length);

        function addDuaEntry(dayIndex, prayer, offset, audio, duaIndex) {
            const container = document.getElementById(`duas-${dayIndex}`);
            const entry = document.createElement('div');
            entry.className = 'dua-entry';
            
            const prayerOptions = ['Fixed Time', 'Fajr', 'Sunrise', 'Zohr', 'Maghrib'];
            const offsetOptions = [-90, -75, -60, -45, -30, -15, 0, 15, 30, 45, 60, 75, 90];
            
            // Determine if this is a fixed time entry
            const isFixedTime = prayer === 'Fixed Time' || (!['Fajr', 'Sunrise', 'Zohr', 'Maghrib'].includes(prayer));
            const displayPrayer = isFixedTime ? 'Fixed Time' : prayer;
            
            // For fixed time, offset should be a time string like "08:00"
            // For relative time, offset should be a number
            const displayOffset = isFixedTime ? (typeof offset === 'string' && offset.includes(':') ? offset : '08:00') : (offset || 0);
            
            entry.innerHTML = `
                <select onchange="updateDuaType(${dayIndex}, ${duaIndex}, this.value)">
                    ${prayerOptions.map(p => 
                        `<option value="${p}" ${displayPrayer === p ? 'selected' : ''}>${p}</option>`
                    ).join('')}
                </select>
                ${isFixedTime ? 
                    `<input type="time" value="${displayOffset}" onchange="updateDua(${dayIndex}, ${duaIndex}, 'offset', this.value)" style="width: 120px; padding: 8px; background: rgba(0, 212, 255, 0.05); border: 1px solid var(--secondary-color); border-radius: 5px; color: var(--primary-color); font-family: 'Courier New', monospace;">` :
                    `<select onchange="updateDua(${dayIndex}, ${duaIndex}, 'offset', this.value)">
                        ${offsetOptions.map(o => 
                            `<option value="${o}" ${displayOffset == o ? 'selected' : ''}>${o === 0 ? 'At time' : (o > 0 ? '+' + o : o) + ' min'}</option>`
                        ).join('')}
                    </select>`
                }
                <select onchange="updateDua(${dayIndex}, ${duaIndex}, 'audio', this.value)">
                    ${[...duaFiles, ...customFiles.duas].map(item => 
                        `<option value="${item.file}" ${audio === item.file ? 'selected' : ''}>${item.name}</option>`
                    ).join('')}
                </select>
                <button class="remove-btn" onclick="removeDua(${dayIndex}, ${duaIndex})">✕</button>
            `;
            container.appendChild(entry);
        }
        
        function updateDuaType(dayIndex, duaIndex, type) {
            if (!settings.duaSchedule[dayIndex]) settings.duaSchedule[dayIndex] = [];
            if (!settings.duaSchedule[dayIndex][duaIndex]) settings.duaSchedule[dayIndex][duaIndex] = {};
            
            if (type === 'Fixed Time') {
                settings.duaSchedule[dayIndex][duaIndex].prayer = 'Fixed Time';
                settings.duaSchedule[dayIndex][duaIndex].offset = '08:00';
            } else {
                settings.duaSchedule[dayIndex][duaIndex].prayer = type;
                settings.duaSchedule[dayIndex][duaIndex].offset = 0;
            }
            
            // Save immediately to preserve the change
            localStorage.setItem('azanClockSettings', JSON.stringify(settings));
            populateDuaSchedule();
        }
        
        function updateDua(dayIndex, duaIndex, field, value) {
            if (!settings.duaSchedule[dayIndex]) settings.duaSchedule[dayIndex] = [];
            if (!settings.duaSchedule[dayIndex][duaIndex]) settings.duaSchedule[dayIndex][duaIndex] = {};
            
            // Store the value as-is (don't convert time strings to integers)
            if (field === 'offset') {
                // If it's a time string (contains ':'), keep it as string
                // If it's a numeric offset, convert to integer
                if (typeof value === 'string' && value.includes(':')) {
                    settings.duaSchedule[dayIndex][duaIndex][field] = value;
                } else {
                    settings.duaSchedule[dayIndex][duaIndex][field] = parseInt(value);
                }
            } else {
                settings.duaSchedule[dayIndex][duaIndex][field] = value;
            }
        }

        function updateCountdown() {
            if (!settings.showCountdown) return;
            
            const now = new Date();
            const todayStr = formatDate(now);
            const todayData = prayerData.find(d => d.date === todayStr);
            
            if (!todayData) return;
            
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            
            // Adjust prayer times for DST
            const fajrAdjusted = adjustTimeForDST(todayData.fajr, now);
            const zohrAdjusted = adjustTimeForDST(todayData.zohr, now);
            const maghribAdjusted = adjustTimeForDST(todayData.maghrib, now);
            
            const prayers = [
                {name: 'Fajr', time: fajrAdjusted},
                {name: 'Zohr', time: zohrAdjusted},
                {name: 'Maghrib', time: maghribAdjusted}
            ];
            
            let nextPrayer = null;
            let minDiff = Infinity;
            
            prayers.forEach(prayer => {
                const prayerMinutes = timeToMinutes(prayer.time);
                const diff = prayerMinutes - currentMinutes;
                
                if (diff > 0 && diff < minDiff) {
                    minDiff = diff;
                    nextPrayer = prayer;
                }
            });
            
            if (nextPrayer) {
                const hours = Math.floor(minDiff / 60);
                const minutes = minDiff % 60;
                const timeStr = hours > 0 ? `${hours}h ${minutes}m` : `${minutes}m`;
                document.getElementById('countdown').textContent = `⏱️ ${nextPrayer.name} in ${timeStr}`;
            } else {
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const tomorrowStr = formatDate(tomorrow);
                const tomorrowData = prayerData.find(d => d.date === tomorrowStr);
                
                if (tomorrowData) {
                    const fajrAdjusted = adjustTimeForDST(tomorrowData.fajr, tomorrow);
                    const minutesUntilMidnight = (24 * 60) - currentMinutes;
                    const fajrMinutes = timeToMinutes(fajrAdjusted);
                    const totalMinutes = minutesUntilMidnight + fajrMinutes;
                    const hours = Math.floor(totalMinutes / 60);
                    const minutes = totalMinutes % 60;
                    document.getElementById('countdown').textContent = `⏱️ Fajr in ${hours}h ${minutes}m`;
                }
            }
        }
        
        function updateTomorrowTimes() {
            const now = new Date();
            const todayStr = formatDate(now);
            const todayData = prayerData.find(d => d.date === todayStr);
            
            if (!todayData) return;
            
            const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const currentMinutes = timeToMinutes(currentTime);
            const maghribAdjusted = adjustTimeForDST(todayData.maghrib, now);
            const maghribMinutes = timeToMinutes(maghribAdjusted);
            
            if (currentMinutes >= maghribMinutes) {
                const tomorrow = new Date(now);
                tomorrow.setDate(tomorrow.getDate() + 1);
                const tomorrowStr = formatDate(tomorrow);
                const tomorrowData = prayerData.find(d => d.date === tomorrowStr);
                
                if (tomorrowData) {
                    const fajrAdjusted = adjustTimeForDST(tomorrowData.fajr, tomorrow);
                    const zohrAdjusted = adjustTimeForDST(tomorrowData.zohr, tomorrow);
                    const maghribAdjusted = adjustTimeForDST(tomorrowData.maghrib, tomorrow);
                    
                    document.getElementById('tomorrow-times').innerHTML = `

        function loadCSV() {
            const csvPath = `Timing/${settings.timingCSV}`;
            
            // PRIORITY 1: For built-in UK cities, use embedded data FIRST
            const embeddedData = getEmbeddedCityData(settings.timingCSV);
            if (embeddedData) {
                console.log(`Using embedded data for ${settings.timingCSV}`);
                parseCSV(embeddedData);
                localStorage.setItem('prayerCSV', embeddedData);
                return;
            }
            
            // PRIORITY 2: Check user uploaded files
            const customCSV = localStorage.getItem(`csv_${settings.timingCSV}`);
            if (customCSV) {
                parseCSV(customCSV);
                localStorage.setItem('prayerCSV', customCSV);
                return;
            }
            
            // PRIORITY 3: Check GitHub downloaded files
            const customCSVFiles = JSON.parse(localStorage.getItem('customCSVFiles') || '{}');
            if (customCSVFiles[settings.timingCSV]) {
                parseCSV(customCSVFiles[settings.timingCSV]);
                localStorage.setItem('prayerCSV', customCSVFiles[settings.timingCSV]);
                return;
            }
            
            // PRIORITY 4: Try to fetch from built-in files (shouldn't reach here for built-in cities)
            fetch(csvPath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`CSV file not found: ${csvPath}`);
                    }
                    return response.text();
                })
                .then(text => {
                    parseCSV(text);
                    localStorage.setItem('prayerCSV', text);
                })
                .catch(err => {
                    console.error(`Error loading CSV: ${err.message}`);
                    // Last resort: check cache
                    const stored = localStorage.getItem('prayerCSV');
                    if (stored) {
                        parseCSV(stored);
                        showError('Using cached prayer times', false);
                        setTimeout(() => hideError(), 3000);
                    } else {
                        showError(`No prayer times available for ${settings.timingCSV}`);
                    }
                });
        }

                'Leicester_yearless.csv': getDefaultLeicesterCSV,

                // Legacy support for old filenames (underscore)
                'London_2025.csv': getDefaultLondonCSV,
                'Birmingham_2025.csv': getDefaultBirminghamCSV,
                'Leicester_2025.csv': getDefaultLeicesterCSV,
                'Peterborough_2025.csv': getDefaultPeterboroughCSV,
                // Support for hyphenated filenames
                'London-2025.csv': getDefaultLondonCSV,
                'Birmingham-2025.csv': getDefaultBirminghamCSV,
                'Leicester-2025.csv': getDefaultLeicesterCSV,
                'Peterborough-2025.csv': getDefaultPeterboroughCSV,
                // Support for any year format
                'London-yearless.csv': getDefaultLondonCSV,
                'Birmingham-yearless.csv': getDefaultBirminghamCSV,
                'Leicester-yearless.csv': getDefaultLeicesterCSV,
                'Peterborough-yearless.csv': getDefaultPeterboroughCSV
            };
            
            // Get the function and call it
            const cityFunction = cityFunctions[filename];
            if (cityFunction) {
                return cityFunction(); // Call the function here
            }
            return null;
        }

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            prayerData = [];
            
            // Helper function to clean time format (remove seconds, ensure HH:MM)
            function cleanTime(timeStr) {
                if (!timeStr) return timeStr;
                // Remove any whitespace
                timeStr = timeStr.trim();
                // Split by colon
                const parts = timeStr.split(':');
                if (parts.length >= 2) {
                    // Get hours and minutes, pad with zeros
                    const hours = parts[0].padStart(2, '0');
                    const minutes = parts[1].padStart(2, '0');
                    return `${hours}:${minutes}`;
                }
                return timeStr;
            }
            
            // Check CSV format by looking at header
            const header = lines[0].toLowerCase();
            const isNewFormat = header.includes('city') && header.includes('month') && header.includes('day');
            
            if (isNewFormat) {
                // New format: City,Month,Day,Imsaak,Fajr,Sunrise,Zohr,Sunset,Maghrib,Tomorrow_Fajr
                // Extract city name from filename more reliably
                let currentCity = settings.timingCSV;
                
                // Remove .csv extension
                currentCity = currentCity.replace('.csv', '');
                
                // Remove year if present (e.g., "_2025")
                currentCity = currentCity.replace(/_\d{4}$/, '');
                
                // Remove "_yearless" suffix
                currentCity = currentCity.replace(/_yearless$/, '');
                
                // Remove any remaining underscores and trim
                currentCity = currentCity.replace(/_/g, ' ').trim();
                
                console.log('Extracting city from filename:', settings.timingCSV, '-> Looking for:', currentCity);
                
                let matchedRows = 0;
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue; // Skip empty lines
                    
                    const parts = line.split(',');
                    if (parts.length >= 10) {
                        const city = parts[0].trim();
                        const month = parts[1].trim().padStart(2, '0');
                        const day = parts[2].trim().padStart(2, '0');
                        
                        // Match city name (case-insensitive, handle spaces)
                        const cityMatch = city.toLowerCase().replace(/\s+/g, ' ');
                        const searchCity = currentCity.toLowerCase().replace(/\s+/g, ' ');
                        
                        if (cityMatch === searchCity) {
                            matchedRows++;
                            const imsaak = cleanTime(parts[3]);
                            const fajr = cleanTime(parts[4]);
                            const sunrise = cleanTime(parts[5]);
                            const zohr = cleanTime(parts[6]);
                            const sunset = cleanTime(parts[7]);
                            const maghrib = cleanTime(parts[8]);
                            const tomorrowFajr = cleanTime(parts[9]);
                            
                            prayerData.push({
                                date: `${day}/${month}`,  // Year-agnostic format
                                imsaak: imsaak,
                                fajr: fajr,
                                sunrise: sunrise,
                                zohr: zohr,
                                sunset: sunset,
                                maghrib: maghrib,
                                tomorrowFajr: tomorrowFajr
                            });
                        }
                    }
                }
                console.log(`Matched ${matchedRows} rows for city: ${currentCity}`);
                if (matchedRows === 0) {
                    console.error('NO MATCHES! First few lines of CSV:', lines.slice(0, 3));
                }
            } else {
                // Old format: Date,Fajr,Sunrise,Zohr,Maghrib
                for (let i = 1; i < lines.length; i++) {
                    const parts = lines[i].split(',');
                    if (parts.length >= 5) {
                        let dateStr = parts[0].trim();
                        // Convert old format (dd/mm/yyyy) to new format (dd/mm)
                        if (dateStr.includes('/')) {
                            const dateParts = dateStr.split('/');
                            if (dateParts.length === 3) {
                                dateStr = `${dateParts[0]}/${dateParts[1]}`; // Remove year
                            }
                        }
                        
                        prayerData.push({
                            date: dateStr,
                            fajr: cleanTime(parts[1]),
                            sunrise: cleanTime(parts[2]),
                            zohr: cleanTime(parts[3]),
                            maghrib: cleanTime(parts[4])
                        });
                    }
                }
            }
            
            console.log(`Loaded ${prayerData.length} prayer times`);
            updateDisplay();
        }
        
        function updateClock() {
            const now = new Date();
            
            const hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            let timeStr;
            if (settings.timeFormat === '12') {
                const period = hours >= 12 ? 'PM' : 'AM';
                const displayHours = hours % 12 || 12;
                if (settings.showSeconds) {
                    timeStr = `${displayHours}:${minutes}:${seconds} ${period}`;
                } else {
                    timeStr = `${displayHours}:${minutes} ${period}`;
                }
            } else {
                if (settings.showSeconds) {
                    timeStr = `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`;
                } else {
                    timeStr = `${String(hours).padStart(2, '0')}:${minutes}`;
                }
            }
            
            document.getElementById('current-time').textContent = timeStr;
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').textContent = now.toLocaleDateString('en-US', options);
            
            if (settings.autoDim) {
                const todayStr = formatDate(now);
                const todayData = prayerData.find(d => d.date === todayStr);
                if (todayData) {
                    const currentTime = `${String(hours).padStart(2, '0')}:${minutes}`;
                    const maghribMinutes = timeToMinutes(todayData.maghrib);
                    const currentMinutes = timeToMinutes(currentTime);
                    
                    if (currentMinutes > maghribMinutes) {
                        document.body.style.filter = 'brightness(50%)';
                    } else {
                        document.body.style.filter = `brightness(${settings.brightness}%)`;
                    }
                }
            }
            
            updateCountdown();
            updateTomorrowTimes();
            checkAndPlay(now);
        }

        function displayPrayerTimes(data, now) {
            const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            // Adjust times for DST if needed
            const imsaakDisplay = data.imsaak ? adjustTimeForDST(data.imsaak, now) : null;
            const fajrDisplay = adjustTimeForDST(data.fajr, now);
            const sunriseDisplay = adjustTimeForDST(data.sunrise, now);
            const zohrDisplay = adjustTimeForDST(data.zohr, now);
            const sunsetDisplay = data.sunset ? adjustTimeForDST(data.sunset, now) : null;
            const maghribDisplay = adjustTimeForDST(data.maghrib, now);
            const tomorrowFajrDisplay = data.tomorrowFajr ? adjustTimeForDST(data.tomorrowFajr, now) : null;
            
            const prayers = [
                {name: 'Imsaak', time: imsaakDisplay, show: settings.showImsaak && imsaakDisplay},
                {name: 'Fajr', time: fajrDisplay, show: true},
                {name: 'Sunrise', time: sunriseDisplay, show: settings.showSunrise},
                {name: 'Zohr', time: zohrDisplay, show: true},
                {name: 'Sunset', time: sunsetDisplay, show: settings.showSunset && sunsetDisplay},
                {name: 'Maghrib', time: maghribDisplay, show: true},
                {name: 'Tomorrow Fajr', time: tomorrowFajrDisplay, show: settings.showTomorrowFajr && tomorrowFajrDisplay}
            ];
            
            let html = '';
            prayers.forEach((prayer, index) => {
                if (!prayer.show) return;
                
                let className = 'prayer-card';
                const prayerMinutes = timeToMinutes(prayer.time);
                const currentMinutes = timeToMinutes(currentTime);
                
                // Only highlight actual prayer times (not Imsaak, Sunset, Tomorrow Fajr)
                if (!['Imsaak', 'Sunset', 'Tomorrow Fajr'].includes(prayer.name)) {
                    if (Math.abs(prayerMinutes - currentMinutes) <= 5) {
                        className += ' active';
                    } else if (prayerMinutes > currentMinutes && prayerMinutes - currentMinutes <= 30) {
                        className += ' upcoming';
                    }
                }
                
                html += `
                    <div class="${className}">
                        <div class="prayer-name">${prayer.name}</div>
                        <div class="prayer-time">${prayer.time}</div>
                    </div>
                `;
            });
            
            document.getElementById('prayer-times').innerHTML = html;
        }
        
        function checkAndPlay(now) {
            if (isMuted) return;
            
            const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const currentSeconds = now.getSeconds();
            const todayStr = formatDate(now);
            const todayData = prayerData.find(d => d.date === todayStr);
            const dayOfWeek = now.getDay();
            const currentHour = now.getHours();
            const currentMinute = now.getMinutes();
            
            // Only check for new events at the start of each minute (when seconds = 0 or 1)
            // This prevents missing events if the app starts mid-minute
            if (currentSeconds > 1) return;
            
            const eventKey = `${todayStr}-${currentTime}`;
            if (lastPlayedEvent === eventKey) return;
            
            let isPrayerTime = false;
            let isDuaTime = false;
            
            if (todayData) {
                // Adjust prayer times for DST
                const fajrAdjusted = adjustTimeForDST(todayData.fajr, now);
                const zohrAdjusted = adjustTimeForDST(todayData.zohr, now);
                const maghribAdjusted = adjustTimeForDST(todayData.maghrib, now);
                
                if (currentTime === fajrAdjusted) {
                    playAudio(`Azan/${settings.azanAudio}`, 'Fajr Azan', settings.volumeAzan / 100, false);
                    lastPlayedEvent = eventKey;
                    return;
                }
                if (currentTime === zohrAdjusted) {
                    playAudio(`Azan/${settings.azanAudio}`, 'Zohr Azan', settings.volumeAzan / 100, false);
                    lastPlayedEvent = eventKey;
                    return;
                }
                if (currentTime === maghribAdjusted) {
                    playAudio(`Azan/${settings.azanAudio}`, 'Maghrib Azan', settings.volumeAzan / 100, false);
                    lastPlayedEvent = eventKey;
                    return;
                }
            }
            
            if (todayData) {
                const todaySchedule = settings.duaSchedule[dayOfWeek] || [];
                const currentMinutes = timeToMinutes(currentTime);
                
                // Track which duas have already been triggered this minute
                let duasTriggered = [];
                
                todaySchedule.forEach((event, eventIndex) => {
                    let targetTime;
                    
                    // Check if this is a fixed time event
                    if (event.prayer === 'Fixed Time' || typeof event.offset === 'string') {
                        // Fixed time - offset contains the time string like "08:00"
                        const fixedTime = typeof event.offset === 'string' ? event.offset : '08:00';
                        targetTime = timeToMinutes(fixedTime);
                    } else {
                        // Relative to prayer time
                        switch(event.prayer) {
                            case 'Fajr':
                                targetTime = timeToMinutes(todayData.fajr) + parseInt(event.offset);
                                break;
                            case 'Sunrise':
                                targetTime = timeToMinutes(todayData.sunrise) + parseInt(event.offset);
                                break;
                            case 'Zohr':
                                targetTime = timeToMinutes(todayData.zohr) + parseInt(event.offset);
                                break;
                            case 'Maghrib':
                                targetTime = timeToMinutes(todayData.maghrib) + parseInt(event.offset);
                                break;
                        }
                    }
                    
                    // Check if this event should trigger and hasn't already
                    const eventId = `${dayOfWeek}-${eventIndex}-${targetTime}`;
                    if (currentMinutes === targetTime && !duasTriggered.includes(eventId)) {
                        duasTriggered.push(eventId);
                        
                        if (currentTime === todayData.fajr || currentTime === todayData.zohr || currentTime === todayData.maghrib) {
                            queueAudio(`Duas/${event.audio}`, event.audio, settings.volumeDuas / 100, true);
                        } else {
                            // If this is the first dua at this time, play it. Otherwise queue it.
                            if (duasTriggered.length === 1) {
                                playAudio(`Duas/${event.audio}`, event.audio, settings.volumeDuas / 100, true);
                            } else {
                                queueAudio(`Duas/${event.audio}`, event.audio, settings.volumeDuas / 100, true);
                            }
                        }
                        lastPlayedEvent = eventKey;
                        isDuaTime = true;
                    }
                });
            }
            
            if (!isPrayerTime && !isDuaTime) {
                if (!settings.tasbeehEnabled) return;
                if (currentlyPlayingDua) return; // Don't interrupt duas with tasbeeh
                
                const [startHour, startMin] = settings.tasbeehStart.split(':').map(Number);
                const [endHour, endMin] = settings.tasbeehEnd.split(':').map(Number);
                const startMinutes = startHour * 60 + startMin;
                const endMinutes = endHour * 60 + endMin;
                const currentTotalMinutes = currentHour * 60 + currentMinute;
                
                if (currentTotalMinutes >= startMinutes && currentTotalMinutes <= endMinutes) {
                    if (currentMinute % settings.tasbeehFrequency === 0 && lastTasbeehMinute !== currentMinute) {
                        let hasConflict = false;
                        
                        if (todayData) {
                            if (currentTime === todayData.fajr || currentTime === todayData.zohr || currentTime === todayData.maghrib) {
                                hasConflict = true;
                            }
                            
                            const todaySchedule = settings.duaSchedule[dayOfWeek] || [];
                            const currentMinutes = timeToMinutes(currentTime);
                            todaySchedule.forEach(event => {
                                let targetTime;
                                
                                // Check if this is a fixed time event
                                if (event.prayer === 'Fixed Time' || typeof event.offset === 'string') {
                                    const fixedTime = typeof event.offset === 'string' ? event.offset : '08:00';
                                    targetTime = timeToMinutes(fixedTime);
                                } else {
                                    switch(event.prayer) {
                                        case 'Fajr':
                                            targetTime = timeToMinutes(todayData.fajr) + parseInt(event.offset);
                                            break;
                                        case 'Sunrise':
                                            targetTime = timeToMinutes(todayData.sunrise) + parseInt(event.offset);
                                            break;
                                        case 'Zohr':
                                            targetTime = timeToMinutes(todayData.zohr) + parseInt(event.offset);
                                            break;
                                        case 'Maghrib':
                                            targetTime = timeToMinutes(todayData.maghrib) + parseInt(event.offset);
                                            break;
                                    }
                                }
                                if (currentMinutes === targetTime) hasConflict = true;
                            });
                        }
                        
                        if (!hasConflict) {
                            let tasbeehFile;
                            if (settings.tasbeehAudio === 'rotate') {
                                const allTasbeeh = [...tasbeehFiles, ...customFiles.tasbeeh];
                                tasbeehFile = `Tasbeeh/${allTasbeeh[currentTasbeehIndex].file}`;
                                currentTasbeehIndex = (currentTasbeehIndex + 1) % allTasbeeh.length;
                            } else {
                                tasbeehFile = `Tasbeeh/${settings.tasbeehAudio}`;
                            }
                            
                            playAudio(tasbeehFile, 'Tasbeeh', settings.volumeTasbeeh / 100, false);
                            lastTasbeehMinute = currentMinute;
                            lastPlayedEvent = eventKey;
                        }
                    }
                }
            }
            
            if (currentMinute % settings.tasbeehFrequency !== 0) {
                lastTasbeehMinute = -1;
            }
        }
        
        function queueAudio(filename, eventName, volume, isDua = false) {
            audioQueue.push({filename, eventName, volume, isDua});
        }
        
        function playAudio(filename, eventName, volume, isDua = false) {
            const audio = document.getElementById('audio-player');
            
            // If we're starting an azan, clear the dua flag (azan can interrupt)
            if (eventName.includes('Azan')) {
                currentlyPlayingDua = false;
            }
            
            // Mark if we're playing a dua
            if (isDua) {
                currentlyPlayingDua = true;
            }
            
            const customAudio = localStorage.getItem(`audio_${filename.split('/').pop()}`);
            if (customAudio) {
                audio.src = customAudio;
            } else {
                audio.src = filename;
            }
            
            audio.volume = Math.min(volume, 1.0);
            
            audio.play().catch(err => {
                console.error('Audio play error:', err);
                showError(`Failed to play ${eventName}: ${err.message}`);
                if (isDua) currentlyPlayingDua = false;
            });
            
            currentAudio = audio;
            
            audio.onended = () => {
                currentAudio = null;
                if (isDua) currentlyPlayingDua = false;
                
                if (audioQueue.length > 0) {
                    const next = audioQueue.shift();
                    playAudio(next.filename, next.eventName, next.volume, next.isDua);
                }
            };
            
            audio.onerror = () => {
                showError(`Audio file not found: ${filename}`);
                currentAudio = null;
                if (isDua) currentlyPlayingDua = false;
            };
        }
        
        function stopAudio() {
            const audio = document.getElementById('audio-player');
            audio.pause();
            audio.currentTime = 0;
            currentAudio = null;
            currentlyPlayingDua = false;
            audioQueue = [];
        }
        
        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            return `${day}/${month}`;  // Year-agnostic: dd/mm only
        }
        
        function formatDateWithYear(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }
        
        function isBST(date) {
            // Check if date is in British Summer Time
            const year = date.getFullYear();
            
            // Last Sunday of March at 1:00 AM
            const marchLast = new Date(year, 2, 31); // March 31
            const lastSunMarch = new Date(marchLast);
            lastSunMarch.setDate(marchLast.getDate() - marchLast.getDay());
            lastSunMarch.setHours(1, 0, 0, 0);
            
            // Last Sunday of October at 2:00 AM  
            const octLast = new Date(year, 9, 31); // October 31
            const lastSunOct = new Date(octLast);
            lastSunOct.setDate(octLast.getDate() - octLast.getDay());
            lastSunOct.setHours(2, 0, 0, 0);
            
            return date >= lastSunMarch && date < lastSunOct;
        }
        
        function adjustTimeForDST(timeStr, date) {
            // If we're in BST period, add 1 hour to GMT times
            if (!isBST(date)) {
                return timeStr;
            }
            
            const [hours, minutes] = timeStr.split(':').map(Number);
            let newHours = hours + 1;
            if (newHours >= 24) {
                newHours = newHours - 24;
            }
            
            return `${String(newHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }
        
        function timeToMinutes(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 60 + minutes;
        }

            countdownInterval = setInterval(() => {
                updateCountdown();
                updateTomorrowTimes();
            }, 30000);
            
            updateClock();
        });
        
        setInterval(updateClock, 1000);
        updateClock();
        
        setInterval(updateDisplay, 60000);
        
        // Capacitor Keep Awake Plugin
        async function initializeCapacitor() {
            if (window.Capacitor && window.Capacitor.isNativePlatform()) {
                try {
                    // Import Keep Awake plugin
                    const { KeepAwake } = await import('@capacitor-community/keep-awake');
                    await KeepAwake.keepAwake();
                    console.log('Keep Awake enabled');
                    
                    // Import Screen Orientation plugin
                    const { ScreenOrientation } = await import('@capacitor/screen-orientation');
                    await ScreenOrientation.lock({ orientation: 'landscape' });
                    console.log('Landscape mode locked');
                    
                    // Enable immersive fullscreen mode
                    await enableImmersiveMode();
                    
                    // Re-enable immersive mode when user swipes/shows nav bar
                    document.addEventListener('visibilitychange', () => {
                        if (!document.hidden) {
                            setTimeout(() => enableImmersiveMode(), 100);
                        }
                    });
                    
                    // Re-enable on window focus
                    window.addEventListener('focus', () => {
                        setTimeout(() => enableImmersiveMode(), 100);
                    });
                    
                    // Check for updates
                    checkForUpdates();
                } catch (err) {
                    console.log('Capacitor plugin error:', err);
                }
            } else {
                // Fallback to browser wake lock
                if ('wakeLock' in navigator) {
                    navigator.wakeLock.request('screen').then(lock => {
                        console.log('Browser wake lock enabled');
                    }).catch(err => {
                        console.log('Wake lock error:', err);
                    });
                }
            }
        }
        
        async function enableImmersiveMode() {
            try {
                // Hide status bar using Capacitor plugin
                const { StatusBar } = await import('@capacitor/status-bar');
                await StatusBar.hide();
                console.log('Status bar hidden');
            } catch (err) {
                console.log('Status bar plugin not available:', err);
            }
            
            // Try Android-specific fullscreen methods
            if (window.AndroidFullScreen) {
                try {
                    await window.AndroidFullScreen.immersiveMode();
                    console.log('AndroidFullScreen immersive mode enabled');
                } catch (err) {
                    console.log('AndroidFullScreen error:', err);
                }
            }
            
            // Fallback: Use Android WebView fullscreen API
            if (window.AndroidInterface && window.AndroidInterface.setFullScreen) {
                try {
                    window.AndroidInterface.setFullScreen(true);
                    console.log('Android interface fullscreen enabled');
                } catch (err) {
                    console.log('Android interface error:', err);
                }
            }
        }
        
        // Update Checker
        async function checkForUpdates() {
            const currentVersion = '1.0.0';
            const updateURL = 'https://raw.githubusercontent.com/YOUR_USERNAME/azan-clock-updates/main/version.json';
            
            try {
                const response = await fetch(updateURL);
                if (!response.ok) {
                    console.log('No update server configured yet');
                    return;
                }
                
                const updateInfo = await response.json();
                
                if (updateInfo.version !== currentVersion) {
                    console.log(`Update available: ${updateInfo.version}`);
                    
                    // Download new timing files if available
                    if (updateInfo.timings && updateInfo.timings.length > 0) {
                        let downloadedCount = 0;
                        for (const timing of updateInfo.timings) {
                            const success = await downloadTimingFile(timing);
                            if (success) downloadedCount++;
                        }
                        
                        // Refresh dropdown to show new timings
                        if (downloadedCount > 0) {
                            populateFileDropdowns();
                        }
                    }
                    
                    // Show update notification
                    showNotification(`Update ${updateInfo.version} installed! ${updateInfo.message || ''}`);
                }
            } catch (err) {
                console.log('Update check failed (this is normal on first install):', err.message);
            }
        }
        
        async function downloadTimingFile(timingInfo) {
            try {
                const response = await fetch(timingInfo.url);
                const csvContent = await response.text();
                
                // Store in localStorage (key is the filename from URL or name field)
                const customCSVFiles = JSON.parse(localStorage.getItem('customCSVFiles') || '{}');
                
                // Use the filename from the name field (should include .csv)
                const filename = timingInfo.name.endsWith('.csv') ? timingInfo.name : `${timingInfo.name}.csv`;
                customCSVFiles[filename] = csvContent;
                localStorage.setItem('customCSVFiles', JSON.stringify(customCSVFiles));
                
                console.log(`Downloaded timing: ${filename}`);
                return true;
            } catch (err) {
                console.log(`Failed to download ${timingInfo.name}:`, err);
                return false;
            }
        }
        
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: rgba(0, 212, 255, 0.95);
                color: white;
                padding: 20px 40px;
                border-radius: 10px;
                font-size: 1.2em;
                z-index: 10000;
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // Initialize Capacitor features
        initializeCapacitor();
    </script>
</body>
</html>
